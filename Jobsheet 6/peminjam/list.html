<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Peminjaman Alat Musik Studio | Daftar Peminjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body class="d-flex flex-column min-vh-100" style="background-color: #faf3f6;">
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#5c1030;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">
                Sistem Peminjaman Alat Musik Studio
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../alat/list.html">Data Alat</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../alat/tambah.html">Tambah Alat</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="list.html">Data Peminjam</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tambah.html">Tambah Peminjam</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#5c1030;">
                    Daftar Peminjam Alat Musik
                </h2>
                <div class="mb-3">
                    <label for="cariPeminjam" class="form-label fw-semibold">
                        Cari Data Peminjam
                    </label>

                    <input type="text" class="form-control" id="cariPeminjam"
                        placeholder="Cari kode atau nama peminjam...">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabelPeminjam">
                        <thead style="background-color:#5c1030;">
                            <tr class="text-white">
                                <th>No</th>
                                <th>Kode Peminjam</th>
                                <th>Nama Peminjam</th>
                                <th>No Whatsapp</th>
                                <th>Alamat</th>
                                <th>Status Member</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelPeminjamBody">
                        </tbody>
                    </table>
                    <div id="loading-indicator" class="text-center py-3">
                        Memuat data peminjam...
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="text-white text-center py-3 small mt-auto" style="background-color: #5c1030;">
        <p class="mb-0">
            &copy; 2026 Sistem Peminjaman Alat Musik Studio
        </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/peminjam.js"></script>
</body>

</html>
