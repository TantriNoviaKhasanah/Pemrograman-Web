<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Peminjaman Alat Musik Studio | Tambah Peminjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#5c1030;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">Sistem Peminjaman Alat Musik Studio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../alat/list.html">Data Alat</a></li>
                    <li class="nav-item"><a class="nav-link" href="../alat/tambah.html">Tambah Alat</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Data Peminjam</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Peminjam</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3" style="color:#5c1030;">Formulir Tambah Peminjam</h2>
                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="id_peminjam" class="form-label fw-semibold">ID Peminjam</label>
                        <input type="text" class="form-control" id="id_peminjam" name="id_peminjam"
                            placeholder="Contoh: PJ005" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama_peminjam" class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama_peminjam" name="nama_peminjam"
                            placeholder="Contoh: Siti Aminah" required>
                    </div>
                    <div class="mb-3">
                        <label for="no_hp" class="form-label fw-semibold">No. Telepon / WhatsApp</label>
                        <input type="tel" class="form-control" id="no_hp" name="no_hp" placeholder="Contoh: 08123456789"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="alamat" class="form-label fw-semibold">Alamat Lengkap</label>
                        <textarea class="form-control" id="alamat" name="alamat" rows="3"
                            placeholder="Masukkan alamat peminjam" required></textarea>
                    </div>
                    <button type="submit" class="btn" style="background-color:#5c1030; color:#fff;">Simpan Data</button>
                    <button type="reset" class="btn btn-secondary">Batal</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 Sistem Peminjaman Alat Musik Studio &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
